<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 158" width="330" height="158" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4349"/>
      <stop offset="0.45" stop-color="#e31e24"/>
      <stop offset="1" stop-color="#9c0e15"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#e4e7eb"/>
      <stop offset="1" stop-color="#b9bec6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a556f"/>
      <stop offset="1" stop-color="#0d1722"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f3f5"/>
      <stop offset="1" stop-color="#7d838c"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9dde2"/>
      <stop offset="1" stop-color="#6f757d"/>
    </linearGradient>
    <radialGradient id="beam" cx="0" cy="0.5" r="1">
      <stop offset="0" stop-color="#fff1b8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff1b8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="archClip"><rect x="0" y="0" width="330" height="114"/></clipPath>
    <g id="wheel">
      <circle r="21" fill="#141416"/>
      <circle r="19.5" fill="none" stroke="#2e2e33" stroke-width="3" stroke-dasharray="3 2.5"/>
      <circle r="15" fill="#1d1d21"/>
      <circle r="12.5" fill="url(#rim)" stroke="#8a9099" stroke-width="1"/>
      <circle r="8.5" fill="#aeb4bb"/>
      <g fill="#555a62">
        <circle cx="6" cy="0" r="1.5"/><circle cx="3" cy="5.2" r="1.5"/><circle cx="-3" cy="5.2" r="1.5"/>
        <circle cx="-6" cy="0" r="1.5"/><circle cx="-3" cy="-5.2" r="1.5"/><circle cx="3" cy="-5.2" r="1.5"/>
      </g>
      <circle r="3" fill="#2b2e34"/>
    </g>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="150" cy="150" rx="146" ry="5" fill="#000" opacity="0.45"/>

  <!-- headlight beam -->
  <path d="M290 92 L330 78 L330 112 Z" fill="url(#beam)"/>

  <!-- underbody -->
  <rect x="8" y="112" width="286" height="12" rx="3" fill="#18181b"/>
  <!-- fuel tank -->
  <rect x="128" y="118" width="58" height="16" rx="6" fill="url(#tank)"/>
  <rect x="128" y="124" width="58" height="2" fill="#000" opacity="0.2"/>

  <!-- cargo box -->
  <rect x="10" y="14" width="178" height="100" rx="8" fill="url(#box)"/>
  <rect x="10" y="14" width="178" height="100" rx="8" fill="url(#gloss)"/>
  <!-- roof edge -->
  <rect x="10" y="14" width="178" height="5" rx="2.5" fill="#ff7a7f" opacity="0.45"/>
  <!-- panel ribs -->
  <g stroke="#8e0d14" stroke-width="1.4" opacity="0.45">
    <line x1="52" y1="24" x2="52" y2="92"/>
    <line x1="146" y1="24" x2="146" y2="92"/>
  </g>
  <!-- conspicuity tape + lower trim -->
  <rect x="10" y="94" width="178" height="3" fill="#7a0a10" opacity="0.7"/>
  <line x1="16" y1="101" x2="182" y2="101" stroke="#fff" stroke-width="3" stroke-dasharray="10 6" opacity="0.85"/>
  <rect x="10" y="106" width="178" height="8" rx="3" fill="#26262b"/>
  <g fill="#555a62">
    <circle cx="24" cy="110" r="1.2"/><circle cx="60" cy="110" r="1.2"/><circle cx="130" cy="110" r="1.2"/><circle cx="174" cy="110" r="1.2"/>
  </g>

  <!-- logo -->
  <g transform="translate(43,40)">
    <rect width="34" height="34" rx="8" fill="#fff"/>
    <path d="M9 13h15l-3.5-3.5M24 13l-3.5 3.5" fill="none" stroke="#e31e24" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M25 23H10l3.5 3.5M10 23l3.5-3.5" fill="none" stroke="#e31e24" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="86" y="66" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-size="25" fill="#fff">UNEX</text>
  <text x="87" y="81" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" letter-spacing="3.6" fill="#ffd9db">EXPRESS</text>

  <!-- tail light + rear bumper -->
  <rect x="6" y="84" width="6" height="16" rx="2" fill="#ffb4b7"/>
  <rect x="4" y="112" width="12" height="7" rx="2" fill="#2a2a30"/>

  <!-- roof deflector -->
  <path d="M186 14 H194 Q206 16 211 38 H186 Z" fill="url(#cab)"/>

  <!-- cab -->
  <path d="M190 38 H246 Q258 38 266 50 L286 82 Q291 89 291 98 V114 H190 Z" fill="url(#cab)"/>
  <!-- cab red stripe -->
  <path d="M190 96 H291 V103 H190 Z" fill="#e31e24"/>
  <rect x="190" y="103" width="101" height="1.5" fill="#fff" opacity="0.8"/>
  <!-- cab lower skirt -->
  <rect x="190" y="106" width="101" height="8" fill="#26262b"/>
  <!-- windshield / side window -->
  <path d="M200 46 H244 Q250 46 254 52 L270 78 H200 Z" fill="url(#glass)"/>
  <path d="M206 50 H222 L208 74 H206 Z" fill="#fff" opacity="0.13"/>
  <path d="M228 50 H236 L224 70 H216 Z" fill="#fff" opacity="0.08"/>
  <!-- door -->
  <path d="M198 44 H250 Q253 44 253 47 V105 H198 Z" fill="none" stroke="#a3a9b1" stroke-width="1.2"/>
  <rect x="204" y="82" width="11" height="3.5" rx="1.7" fill="#6b717a"/>
  <!-- step -->
  <rect x="206" y="106" width="34" height="3" rx="1.5" fill="#8a9099"/>
  <!-- mirror -->
  <rect x="254" y="56" width="7" height="17" rx="2.5" fill="#1c1c20"/>
  <rect x="255" y="58" width="2" height="12" rx="1" fill="#fff" opacity="0.25"/>
  <!-- roof marker lights -->
  <g fill="#ffb300"><circle cx="212" cy="41.5" r="2"/><circle cx="222" cy="41.5" r="2"/><circle cx="232" cy="41.5" r="2"/></g>
  <!-- headlight -->
  <rect x="277" y="86" width="12" height="9" rx="3" fill="#fff4c4"/>
  <rect x="279" y="88" width="8" height="5" rx="2" fill="#fff"/>
  <rect x="279" y="96.5" width="9" height="2.5" rx="1" fill="#ffa400"/>
  <!-- grille -->
  <rect x="276" y="100" width="15" height="12" rx="2" fill="#1a1a1e"/>
  <g stroke="#6b717a" stroke-width="1"><line x1="278" y1="103" x2="289" y2="103"/><line x1="278" y1="106" x2="289" y2="106"/><line x1="278" y1="109" x2="289" y2="109"/></g>
  <!-- front bumper -->
  <rect x="272" y="112" width="26" height="8" rx="3" fill="#2a2a30"/>
  <rect x="274" y="113" width="22" height="2" rx="1" fill="#fff" opacity="0.2"/>

  <!-- wheel arches -->
  <g fill="#0b0b0d" clip-path="url(#archClip)">
    <circle cx="80" cy="128" r="25"/>
    <circle cx="245" cy="128" r="25"/>
  </g>

  <!-- mud flap -->
  <rect x="50" y="118" width="6" height="24" rx="1.5" fill="#111113"/>
  <rect x="50" y="136" width="6" height="6" rx="1.5" fill="#e31e24"/>

  <!-- wheels -->
  <use href="#wheel" x="80" y="128"/>
  <use href="#wheel" x="245" y="128"/>
</svg>
